name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: build the companion plugin (bundled into the binary)
        run: mvn -q -B -DskipTests package
        working-directory: companion
      - name: install cross (linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked
      - name: build (linux, via cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }}
      - name: build
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          mkdir -p dist/out
          cp companion/target/McplugBridge-*.jar dist/ || true
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/mcplug.exe dist/out/
            (cd dist/out && 7z a ../mcplug-$V-${{ matrix.target }}.zip mcplug.exe)
          else
            cp target/${{ matrix.target }}/release/mcplug dist/out/
            tar -C dist/out -czf dist/mcplug-$V-${{ matrix.target }}.tar.gz mcplug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/mcplug-*
            dist/McplugBridge-*.jar
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: (cd artifacts && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
