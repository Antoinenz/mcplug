[package]
name = "mcplug"
version = "0.1.0"
edition = "2021"
description = "Terminal plugin and server-jar manager for Minecraft servers (Modrinth, Hangar, GitHub; MCSManager-aware)"
license = "MIT"
repository = "https://github.com/Antoinenz/mcplug"
rust-version = "1.80"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
async-trait = "0.1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
glob-match = "0.2"
humantime = "2"
humansize = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
